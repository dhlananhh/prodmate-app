openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: API documentation for managing todos, including standalone todos, todos linked to habits, and todos linked to events.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Todos
    description: Endpoints for managing todos

paths:
  /todos:
    get:
      summary: Retrieve all todos
      tags: [Todos]
      responses:
        '200':
          description: A list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      summary: Create a standalone todo
      tags: [Todos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            examples:
              standalone:
                summary: Example standalone todo
                value:
                  title: "Buy groceries"
                  description: "Milk, bread, eggs, and fruits"
                  deadline: "2026-04-30T18:00:00.000Z"
                  priority: "high"
                  status: "pending"
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'

  /todos/{id}:
    get:
      summary: Retrieve a todo by ID
      tags: [Todos]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Todo details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
    put:
      summary: Update a standalone todo by ID
      tags: [Todos]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            examples:
              updateStandalone:
                summary: Example update standalone todo
                value:
                  title: "Buy groceries and cleaning supplies"
                  description: "Milk, bread, eggs, fruits, and soap"
                  deadline: "2026-05-01T18:00:00.000Z"
                  priority: "medium"
                  status: "in-progress"
      responses:
        '200':
          description: Todo updated successfully
    delete:
      summary: Delete a standalone todo by ID
      tags: [Todos]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Todo deleted successfully
        '404':
          description: Todo not found

  /habits/{habitId}/todos:
    post:
      summary: Create a todo linked to a specific habit
      tags: [Todos]
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            examples:
              habitTodo:
                summary: Example habit todo
                value:
                  title: "Read 20 pages"
                  description: "Daily reading habit"
                  deadline: "2026-04-27T21:00:00.000Z"
                  priority: "medium"
                  status: "pending"
      responses:
        '201':
          description: Todo for habit created successfully

  /habits/{habitId}/todos/{todoId}:
    put:
      summary: Update a todo linked to a specific habit
      tags: [Todos]
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: todoId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            examples:
              updateHabitTodo:
                summary: Example update habit todo
                value:
                  title: "Read 30 pages"
                  description: "Increase daily reading goal"
                  deadline: "2026-04-28T21:00:00.000Z"
                  priority: "high"
                  status: "in-progress"
      responses:
        '200':
          description: Todo of habit updated successfully
        '404':
          description: Todo not found in habit
    delete:
      summary: Delete a todo linked to a specific habit
      tags: [Todos]
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: todoId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Todo of habit deleted successfully
        '404':
          description: Todo not found in habit

  /events/{eventId}/todos:
    post:
      summary: Create a todo linked to a specific event
      tags: [Todos]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            examples:
              eventTodo:
                summary: Example event todo
                value:
                  title: "Prepare presentation slides"
                  description: "Slides for the upcoming workshop"
                  deadline: "2026-05-01T09:00:00.000Z"
                  priority: "high"
                  status: "pending"
      responses:
        '201':
          description: Todo for event created successfully

  /events/{eventId}/todos/{todoId}:
    put:
      summary: Update a todo linked to a specific event
      tags: [Todos]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
        - name: todoId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            examples:
              updateEventTodo:
                summary: Example update event todo
                value:
                  title: "Finalize presentation slides"
                  description: "Add graphs and polish design"
                  deadline: "2026-05-01T12:00:00.000Z"
                  priority: "high"
                  status: "in-progress"
      responses:
        '200':
          description: Todo of event updated successfully
        '404':
          description: Todo not found in event
    delete:
      summary: Delete a todo linked to a specific event
      tags: [Todos]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
        - name: todoId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Todo of event deleted successfully
        '404':
          description: Todo not found in event

components:
  schemas:
    Todo:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        priority: { type: string }
        status: { type: string }
        habitId: { type: integer, nullable: true }
        eventId: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TodoInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [pending, in-progress, completed] }
      required: [title, priority, status]
